name: ✅ Code Quality & Tests
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_INDEX_HOMELAB_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
  UV_INDEX_HOMELAB_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
  PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
  PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
jobs:
  ci:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-python-ci.yaml@0.29.4
    with:
      python-versions: '["3.12"]'
      workspace: true
      # Keep the Airflow image check below so it remains after the test job.
      test-container: false
    secrets:
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}

  docker-build-test:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow image (sanity check)
        env:
          PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
          PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
        run: |-
          docker build \
            -f docker/Dockerfile \
            --build-arg PYPI_SERVER_USERNAME="$PYPI_SERVER_USERNAME" \
            --build-arg PYPI_SERVER_PASSWORD="$PYPI_SERVER_PASSWORD" \
            -t homelab-airflow-dags:ci .
