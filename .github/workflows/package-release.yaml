name: 🚀 Release Build & Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      push_latest:
        description: Also update the latest container image tag
        required: false
        type: boolean
        default: true
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: true
    secrets:
      PYPI_TOKEN:
        required: false
      PYPI_SERVER_USERNAME:
        required: false
      PYPI_SERVER_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      push_latest:
        description: Also update the latest container image tag
        required: false
        type: boolean
        default: false
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-python-release.yaml@0.29.5
    with:
      tag: ${{ inputs.tag }}
      workspace: true
      deploy-docs: ${{ inputs.deploy_docs }}
      publish-container: true
      containerfile: ./docker/Dockerfile
      push-latest: ${{ inputs.push_latest }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
