name: 🚀 Release Build & Publish
on:
  workflow_call:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      push_latest:
        description: Also update the latest container image tag
        required: false
        type: boolean
        default: true
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing global release tag to build and publish
        required: true
        type: string
      push_latest:
        description: Also update the latest container image tag
        required: false
        type: boolean
        default: false
      deploy_docs:
        description: Deploy documentation for this release
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_INDEX_HOMELAB_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      UV_INDEX_HOMELAB_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build changed distributions
        run: uvx --from rust-just just build-changed
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_PUBLIC_PYPI == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uvx --from rust-just just publish-pypi

  publish-private-pypi:
    needs: build
    runs-on: ubuntu-latest
    env:
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to private PyPI server
        run: uvx --from rust-just just publish-pypi-server

  release:
    needs: [publish-pypi, publish-private-pypi]
    # A disabled public PyPI publish is an intentional skip, not a release failure.
    if: >-
      ${{
        always() &&
        needs.publish-private-pypi.result == 'success' &&
        (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker:
    needs: release
    # `release` uses always() so a deliberately skipped public PyPI job does
    # not block it. Repeat the explicit success check for downstream jobs to
    # avoid inheriting that skipped ancestor through the default success().
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/docker-release.yaml
    with:
      tag: ${{ inputs.tag }}
      push_latest: ${{ inputs.push_latest }}
    secrets: inherit

  docs:
    needs: release
    if: ${{ always() && needs.release.result == 'success' && inputs.deploy_docs }}
    uses: ./.github/workflows/docs-deploy.yaml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
