name: 🔄 Auto Version Bump
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  packages: write
concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(version):') }}
    runs-on: ubuntu-latest
    name: Bump packages and update changelogs with cocogitto
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      # cocogitto's pre_bump_hooks run `uv lock --no-upgrade`, which resolves
      # the private homelab-config dependency from the homelab index.
      UV_INDEX_HOMELAB_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      UV_INDEX_HOMELAB_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cocogitto monorepo release
        id: release
        uses: cocogitto/cocogitto-action@v3
        with:
          release: true
          # Only check commits since the latest tag - the repo predates
          # conventional commits and has legacy non-conventional history.
          check-latest-tag-only: true
          git-user: 'cog-bot'
          git-user-email: 'cog-bot@users.noreply.github.com'

      - name: Resolve global release tag
        id: version
        shell: bash
        run: |
          tag="$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$tag" ]]; then
            echo "No package release required"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/package-release.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
      push_latest: true
      deploy_docs: true
    secrets: inherit
