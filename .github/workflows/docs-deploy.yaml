name: 📚 Deploy Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: Existing global release tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing global release tag to deploy
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    uses: ShawnDen-coder/repo-scaffold/.github/workflows/reusable-docs-deploy.yaml@2b17362462c825b27f3547e8dbf120759a8754c6 # 0.29.0
    with:
      tag: ${{ inputs.tag }}
      create-release: true
      artifact-name: dist
    secrets:
      PYPI_SERVER_USERNAME: ${{ secrets.PYPI_SERVER_USERNAME }}
      PYPI_SERVER_PASSWORD: ${{ secrets.PYPI_SERVER_PASSWORD }}
