[project]
name = "homelab-airflow-dags-workspace"
version = "0.11.0"
description = "homelab cluster airflow dags"
authors = [{name = "Shawn Deng", email = "shawndeng1109@qq.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.12.99"
dependencies = []

[project.urls]
Homepage = "https://github.com/shawndeng-homelab/homelab-airflow-dags"
Repository = "https://github.com/shawndeng-homelab/homelab-airflow-dags"
Documentation = "https://shawndeng-homelab.github.io/homelab-airflow-dags"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
name = "homelab"
url = "https://pypiserver.shawndeng.cc/simple/"

[tool.uv.sources]
homelab-config = { index = "homelab" }
ibkr-quant = { index = "homelab" }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "virtualenv>=20.26.0",
]

docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.5",
    "mkdocs-gen-files>=0.5.0",
    "pymdown-extensions>=10.7",
    "mkdocs-literate-nav>=0.6.1",
]
