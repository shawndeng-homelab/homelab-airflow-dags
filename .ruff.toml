include = ["pyproject.toml", "packages/**/*.py", "scripts/**/*.py"]
line-length = 120
target-version = "py312"

[lint]
extend-ignore = [
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
]
ignore = [
  "W191",  # indentation contains tabs
  "D401",  # imperative mood
  "RUF001",  # ambiguous unicode char in string (中文全角标点属正常)
  "RUF002",  # ambiguous unicode char in docstring (中文全角标点属正常)
  "RUF003"  # ambiguous unicode char in comment (中文全角标点属正常)
]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",  # pydocstyle
  "UP",  # pyupgrade
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "PLC0415"  # import should be at top-level of file
]

[lint.isort]
force-single-line = true
lines-after-imports = 2

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"packages/homelab-airflow-providers-bilibili/src/**/*.py" = [
  "PLC0415",  # biliup, Airflow, and S3 imports are intentionally lazy at runtime
  "D102",     # provider protocol and Airflow adapter methods document behavior inline
  "D107",     # Airflow constructors follow the framework signature
]
"packages/homelab-airflow-providers-bilibili/tests/**/*.py" = [
  "D101",
  "D102",
  "D103",
  "D107",
  "PLC0415",
]

"packages/**/dags/**/*.py" = [
  "PLC0415",  # in-function imports are intentional: lazy runtime config resolution via get_config,
              # and the scripts.* import must live inside the @virtualenv_task body (ships in ibkr-quant wheel)
]
"scripts/**/*.py" = [
  "PLC0415",  # in-function imports are normal in scripts (conditional deps, delayed heavy imports)
  "D103",     # scripts don't need docstrings on every function
]
