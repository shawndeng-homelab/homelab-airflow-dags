[project]
name = 'homelab-airflow-providers-youtube'
version = "0.1.1"
description = 'Apache Airflow provider for discovering public YouTube videos'
readme = 'README.md'
authors = [
    { name = 'Shawn Deng', email = 'shawndeng1109@qq.com' }
]
license = 'MIT'
requires-python = '>=3.12, <3.12.99'
dependencies = [
    'apache-airflow==2.11.0',
    'homelab-video-contracts>=0.1.0,<0.2.0',
    'requests>=2.32.0',
]

[tool.uv.sources]
homelab-video-contracts = { workspace = true }

[project.entry-points.'apache_airflow_provider']
provider_info = 'homelab_airflow_providers_youtube.get_provider_info:get_provider_info'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/homelab_airflow_providers_youtube']
