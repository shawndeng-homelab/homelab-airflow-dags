[project]
name = "homelab-airflow-providers-financial-data"
version = "0.1.0"
description = "Apache Airflow provider for financial market data ingestion"
readme = "README.md"
authors = [{ name = "Shawn Deng", email = "shawndeng1109@qq.com" }]
license = "MIT"
requires-python = ">=3.12, <3.12.99"
dependencies = [
    "apache-airflow==2.11.0",
    "apache-airflow-providers-amazon>=9.10.0",
    "polars>=1.0.0",
    "pydantic>=2.11.7",
    "requests>=2.32.0",
]

[project.optional-dependencies]
optopsy = ["optopsy", "pandas"]

[project.entry-points.'apache_airflow_provider']
provider_info = 'homelab_airflow_providers_financial_data.get_provider_info:get_provider_info'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_airflow_providers_financial_data"]
