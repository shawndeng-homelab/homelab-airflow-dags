[project]
name = "homelab-airflow-dags"
version = "0.4.0"
description = "homelab cluster airflow dags"
authors = [{name = "Shawn Deng", email = "shawndeng1109@qq.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.12.99"
dependencies = [
    "apache-airflow==2.11.0",
    "apache-airflow-providers-amazon>=9.10.0",
    "fake-useragent>=2.2.0",
    "loguru>=0.7.3",
    "py-consul>=1.6.0",
    "pyyaml>=6.0.2",
    "homelab-config>=0.3.3",
    "homelab-airflow-bark>=0.2.0,<0.3.0",
    "homelab-airflow-providers-youtube>=0.1.0,<0.2.0",
    "exchange-calendars>=4.12",
]

[tool.uv.sources]
homelab-airflow-bark = { workspace = true }
homelab-airflow-providers-youtube = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_airflow_dags"]

