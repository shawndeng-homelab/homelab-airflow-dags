[project]
name = 'homelab-video-contracts'
version = "0.1.0"
description = 'Versioned data contracts for the homelab video localization pipeline'
readme = 'README.md'
authors = [
    { name = 'Shawn Deng', email = 'shawndeng1109@qq.com' }
]
license = 'MIT'
requires-python = '>=3.12, <3.12.99'
dependencies = [
    'pydantic>=2.11.7',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/homelab_video_contracts']
