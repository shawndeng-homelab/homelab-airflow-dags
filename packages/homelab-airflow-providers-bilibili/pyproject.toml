[project]
name = "homelab-airflow-providers-bilibili"
version = "0.0.1"
description = "Apache Airflow provider for biliup-backed Bilibili publishing"
readme = "README.md"
authors = [
    { name = "ShawnDeng-code", email = "shawndeng1109@qq.com" }
]
requires-python = ">=3.12, <3.12.99"
dependencies = [
    "apache-airflow==2.11.0",
    "apache-airflow-providers-amazon>=9.0.0,<10.0.0",
    "biliup==1.2.2",
    "homelab-video-contracts>=0.1.0,<0.2.0",
]

[tool.uv.sources]
homelab-video-contracts = { workspace = true }

[project.entry-points.'apache_airflow_provider']
provider_info = 'homelab_airflow_providers_bilibili.get_provider_info:get_provider_info'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_airflow_providers_bilibili"]
